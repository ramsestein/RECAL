# Synthetic example (public data shipped in synthetic_data/).
# Run from the repository root:  recal --config configs/synthetic_mlp.yaml
# Source model: MLP (scaler + MLPClassifier) trained by synthetic_data/train_models.py on synthetic_features.csv.

model:
  path: synthetic_data/models/nn_pipeline.joblib

source:
  path: synthetic_data/synthetic_features.csv
  outcome_col: target
  schema: synthetic_data/models/feature_schema.json

target:
  path: synthetic_data/synthetic_transfer.csv
  outcome_col: target

recal_core:
  pca_k: 5
  max_n_sweep: 30
  apply_qt: true
  max_missing_rate: 0.5

overfitting_check:
  enabled: true
  method: kfold
  n_splits: 5
  random_state: 42

evaluation:
  oracle_eval: true
  oracle_cv: 5
  feature_attribution: false
  counterfactual_alternatives: 0
  brier_decompose: true

output:
  report: outputs/synthetic_mlp/recal_report.html
  recal_model: outputs/synthetic_mlp/recal.joblib
  metrics_json: outputs/synthetic_mlp/metrics.json
  source_name: "Synthetic source"
  target_name: "Synthetic target"
  timestamp: false
